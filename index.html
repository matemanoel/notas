
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Boletim Escolar - 2º Ano</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f2f2f2;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
}

h1, h2 {
    text-align: center;
    color: #174c80;
}

.dados {
    line-height: 1.8;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #999;
    padding: 9px;
    text-align: center;
}

th {
    background: #174c80;
    color: white;
}

td:first-child {
    text-align: left;
}

.aprovado {
    color: green;
    font-weight: bold;
}

.recuperacao {
    color: #c07800;
    font-weight: bold;
}

@media print {
    body {
        background: white;
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>BOLETIM ESCOLAR</h1>
<h2>2º Ano do Ensino Médio – Paraná</h2>

<div class="dados">
    <b>Aluno:</b> João da Silva<br>
    <b>Escola:</b> Colégio Estadual do Paraná<br>
    <b>Turma:</b> 2º Ano A<br>
    <b>Ano letivo:</b> 2026
</div>

<table>
<thead>
<tr>
    <th>Componente Curricular</th>
    <th>1º Tri.</th>
    <th>2º Tri.</th>
    <th>3º Tri.</th>
    <th>Média</th>
    <th>Situação</th>
</tr>
</thead>

<tbody id="boletim"></tbody>

</table>

<h3 id="resultado"></h3>

</div>

<script>

// Dados previamente informados

const notas = [
["Língua Portuguesa", 7.0, 8.0, 7.5],
["Língua Inglesa", 8.0, 7.5, 9.0],
["Arte", 9.0, 8.5, 9.0],
["Educação Física", 9.0, 9.5, 10.0],
["Matemática", 6.0, 7.0, 8.0],
["Biologia", 7.5, 8.0, 7.0],
["Física", 6.5, 7.0, 8.0],
["Química", 7.0, 6.5, 8.0],
["História", 8.0, 7.5, 8.5],
["Geografia", 7.0, 8.0, 7.5],
["Filosofia", 8.0, 9.0, 8.5],
["Sociologia", 9.0, 8.0, 9.0],
["Educação Financeira", 8.0, 8.5, 9.0],
["Educação Digital e Computação", 9.0, 9.0, 8.5],
["Projeto de Vida", 9.0, 8.5, 9.0]
];

const mediaMinima = 6.0;

let html = "";
let aprovadas = 0;
let recuperacao = 0;

notas.forEach(item => {

    const nome = item[0];

    const n1 = item[1];
    const n2 = item[2];
    const n3 = item[3];

    const media = (n1 + n2 + n3) / 3;

    let situacao;

    if (media >= mediaMinima) {
        situacao = "Aprovado";
        aprovadas++;
    } else {
        situacao = "Em recuperação";
        recuperacao++;
    }

    const classe = media >= mediaMinima
        ? "aprovado"
        : "recuperacao";

    html += `
    <tr>
        <td>${nome}</td>
        <td>${n1.toFixed(1)}</td>
        <td>${n2.toFixed(1)}</td>
        <td>${n3.toFixed(1)}</td>
        <td><b>${media.toFixed(1)}</b></td>
        <td class="${classe}">${situacao}</td>
    </tr>
    `;

});

document.getElementById("boletim").innerHTML = html;

document.getElementById("resultado").innerHTML =
    "Componentes com média suficiente: " + aprovadas +
    "<br>Componentes em recuperação: " + recuperacao;

</script>

</body>
</html>
